# ============================================================
# Profil DEV — digunakan saat development di lokal
# ============================================================

# Database lokal
spring.datasource.url=jdbc:postgresql://localhost:5432/pos_db
spring.datasource.username=pos_user
spring.datasource.password=root

# Tampilkan query SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.pos=DEBUG

# Log hanya ke console (tidak perlu file di lokal)
logging.file.name=
