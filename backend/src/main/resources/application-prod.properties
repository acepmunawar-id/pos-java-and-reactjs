# ============================================================
# Profil PROD — digunakan di server produksi
# Semua nilai sensitif wajib diisi lewat environment variable
# ============================================================

# Database (wajib di-set via env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sembunyikan query SQL di produksi
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.pos=INFO

# Log ke file
logging.file.name=${LOG_FILE:/var/log/pos-app/pos-app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# JWT wajib di-override via env di produksi
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS hanya izinkan domain produksi
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator hanya health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
