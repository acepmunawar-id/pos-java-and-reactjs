spring:
  application:
    name: pos-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_db}
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-please-override-in-env-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 jam
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  store:
    name: ${STORE_NAME:Toko Sederhana}
    address: ${STORE_ADDRESS:Jl. Contoh No. 123, Jakarta}
    phone: ${STORE_PHONE:0812-3456-7890}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.pos: INFO
    org.hibernate.SQL: WARN
